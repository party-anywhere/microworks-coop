<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <!-- Capa modelo (3:4). Troque pela arte do seu jogo; exporte como PNG/JPG/WebP de 900x1200. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <circle cx="450" cy="460" r="180"/>
    <circle cx="450" cy="460" r="260"/>
    <circle cx="450" cy="460" r="340"/>
  </g>
  <text x="450" y="1000" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900" fill="#ffffff">MEU JOGO</text>
  <text x="450" y="1070" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" fill-opacity="0.85">1 a 10 jogadores</text>
</svg>
